name: Update README cards

on:
  schedule:
    # 每天 UTC 00:00，即新加坡时间 08:00
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # GitHub Statistics
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide=prs&theme=codeSTACKr"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=codeSTACKr"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # VOCALOID-TRANSFORM
      - name: Generate VOCALOID-TRANSFORM card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=VOCALOID-TRANSFORM&theme=dark&bg_color=121212&hide_border=true"
          path: profile/pin-vocaloid-transform.svg
          token: ${{ secrets.GITHUB_TOKEN }}

    # Fault_Classification_PMU_Data
      - name: Generate Fault_Classification_PMU_Data card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Fault_Classification_PMU_Data&theme=dark&bg_color=121212&hide_border=true"
          path: profile/pin-fault-classification-pmu-data.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit all generated SVG files
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
