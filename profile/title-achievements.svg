<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-label="Achievements">
  <style>
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
    }
    .petal { transform-box: fill-box; transform-origin: center; opacity: 0; animation: fall linear infinite; }
    @keyframes fall {
      0% { opacity: 0; transform: translate(0, -40px) rotate(0deg); }
      10% { opacity: 0.95; }
      85% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(var(--dx, 70px), var(--dy, 340px)) rotate(560deg); }
    }
    .gl-c, .gl-m { opacity: 0; }
    .gl-c { fill: #4fd8e8; animation: glc 6s steps(1) infinite; }
    .gl-m { fill: #ff5fa2; animation: glm 6s steps(1) infinite; }
    @keyframes glc {
      0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
      87% { opacity: 0.85; transform: translate(-5px, 1px); }
      89% { opacity: 0.85; transform: translate(4px, -2px); }
      91% { opacity: 0; }
      94% { opacity: 0.7; transform: translate(-3px, 0); }
      95% { opacity: 0; }
    }
    @keyframes glm {
      0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
      87% { opacity: 0.85; transform: translate(5px, -1px); }
      89% { opacity: 0.85; transform: translate(-4px, 2px); }
      91% { opacity: 0; }
      94% { opacity: 0.7; transform: translate(3px, 0); }
      95% { opacity: 0; }
    }
    .shake { animation: shake 6s steps(1) infinite; }
    @keyframes shake {
      0%, 86%, 100% { transform: translate(0, 0); }
      87% { transform: translate(2px, 0) skewX(-6deg); }
      89% { transform: translate(-2px, 0) skewX(4deg); }
      91% { transform: translate(0, 0); }
    }

    .title { font: 700 34px Georgia, 'Times New Roman', serif; letter-spacing: 1.5px; }
    .jp { font: 400 15px 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', serif; letter-spacing: 8px; fill: #c96f7f; }
    .line { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.6s 0.3s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .reveal { animation: reveal 1.4s ease-out both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); letter-spacing: 12px; } to { opacity: 1; transform: none; } }
    .cursor { fill: #c96f7f; animation: blink 0.9s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8e3a59" /><stop offset="0.35" stop-color="#c96f7f" /><stop offset="0.5" stop-color="#f6c9cf" /><stop offset="0.65" stop-color="#c96f7f" /><stop offset="1" stop-color="#8e3a59" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="4.5s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#c96f7f" stop-opacity="0" /><stop offset="1" stop-color="#c96f7f" /></linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#c96f7f" /><stop offset="1" stop-color="#c96f7f" stop-opacity="0" /></linearGradient>
  </defs>
  <path class="line" d="M300.8 40H70.80000000000001" stroke="url(#fadeR)" stroke-width="1.5" />
  <path class="line" d="M599.2 40H829.2" stroke="url(#fadeL)" stroke-width="1.5" />
  <path class="spark" fill="#c96f7f" d="M52.80000000000001 32C53.76000000000001 39.04 53.76000000000001 39.04 60.80000000000001 40C53.76000000000001 40.96 53.76000000000001 40.96 52.80000000000001 48C51.84000000000001 40.96 51.84000000000001 40.96 44.80000000000001 40C51.84000000000001 39.04 51.84000000000001 39.04 52.80000000000001 32Z" style="animation-delay:0s"/>
  <path class="spark" fill="#c96f7f" d="M847.2 32C848.1600000000001 39.04 848.1600000000001 39.04 855.2 40C848.1600000000001 40.96 848.1600000000001 40.96 847.2 48C846.24 40.96 846.24 40.96 839.2 40C846.24 39.04 846.24 39.04 847.2 32Z" style="animation-delay:1.8s"/>
  <path class="spark" fill="#c96f7f" d="M304.8 13C305.40000000000003 17.4 305.40000000000003 17.4 309.8 18C305.40000000000003 18.6 305.40000000000003 18.6 304.8 23C304.2 18.6 304.2 18.6 299.8 18C304.2 17.4 304.2 17.4 304.8 13Z" style="animation-delay:0.9s"/>
  <path class="spark" fill="#c96f7f" d="M595.2 59C595.8000000000001 63.4 595.8000000000001 63.4 600.2 64C595.8000000000001 64.6 595.8000000000001 64.6 595.2 69C594.6 64.6 594.6 64.6 590.2 64C594.6 63.4 594.6 63.4 595.2 59Z" style="animation-delay:2.7s"/>
  <g class="reveal"><g><text class="title gl-c" x="450.0" y="52" text-anchor="middle">Achievements</text><text class="title gl-m" x="450.0" y="52" text-anchor="middle">Achievements</text><text class="title shake" x="450.0" y="52" text-anchor="middle" fill="url(#shimmer)">Achievements</text></g></g>
  <text class="jp reveal" x="450.0" y="88" text-anchor="middle" style="animation-delay:0.5s">「実績解除」</text>
</svg>
