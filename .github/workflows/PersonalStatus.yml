name: Update README cards

on:
  schedule:
    # 每天 UTC 00:00，即新加坡时间 08:00
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 改了卡片配置后立刻重新生成
  push:
    branches:
      - main
    paths:
      - .github/workflows/PersonalStatus.yml
      - .github/scripts/**

env:
  # 卡片按纸白墨黑生成，decorate.py 只从里面读数据（奖杯除外：去色后直接用）
  CARD_COLORS: "title_color=15171d&text_color=15171d&icon_color=15171d&bg_color=f3f1ee&border_color=15171d&border_radius=6"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # GitHub Statistics
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide=prs&ring_color=15171d&${{ env.CARD_COLORS }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&${{ env.CARD_COLORS }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Typewriter-Nocturne
      - name: Generate Typewriter-Nocturne card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Typewriter-Nocturne&${{ env.CARD_COLORS }}"
          path: profile/pin-typewriter-nocturne.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Yohaku
      - name: Generate Yohaku card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Yohaku&${{ env.CARD_COLORS }}"
          path: profile/pin-yohaku.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 奖杯：公共的 vercel 服务失效了，这里直接运行它的代码生成 SVG
      - name: Check out the trophy generator
        uses: actions/checkout@v6
        with:
          repository: ryo-ma/github-profile-trophy
          ref: 43736b50a82fca73c8df1c81abb40aa03519975c
          path: .trophy

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # 和上游 CI 用的版本一致
          deno-version: "1.44.4"

      - name: Generate trophies
        # 接口偶尔出错时保留上一次的奖杯，不影响其他卡片
        continue-on-error: true
        working-directory: .trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ../.github/scripts/render-trophy.ts .
          deno run --allow-net --allow-env --allow-read --allow-write render-trophy.ts "${{ github.repository_owner }}" ../profile/trophy.svg

      # 活动折线图：先下载到仓库里，再由 decorate.py 加动画；接口出错时保留上一次的图
      - name: Download activity graph
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o profile/activity.svg.tmp "https://github-readme-activity-graph-inky.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=f3f1ee&color=15171d&line=15171d&point=15171d&area=true&area_color=d8d6d1&title_color=15171d&hide_border=true&radius=6&custom_title=Activity%20Graph"
          mv profile/activity.svg.tmp profile/activity.svg

      # 贪吃蛇：灰阶格子，蛇是墨色
      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-raw.svg?color_snake=#15171d&color_dots=#e4e1db,#c9c6bf,#9a978f,#5d5b56,#15171d

      # 从卡片里读出数据，重画成静态的黑白漫画风卡片（浅色 / 深色两版）；贪吃蛇是主页上唯一还在动的一张
      - name: Decorate cards
        run: python3 .github/scripts/decorate.py

      # Commit all generated SVG files
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
