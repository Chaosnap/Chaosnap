<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="104" viewBox="0 0 900 104" role="img" aria-label="Now Playing">
<style>@font-face { font-family: 'Playfair Display'; font-weight: 400; font-style: normal; src: url(data:font/ttf;base64,) format('truetype'); }@font-face { font-family: 'Shippori Mincho B1'; font-weight: 800; font-style: normal; src: url(data:font/ttf;base64,) format('truetype'); }
  .tj { font: 800 26px 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; fill: #15171d; letter-spacing: 9px; }
  .te { font: 400 11px 'Playfair Display', Georgia, 'Times New Roman', serif; fill: #8b8d95; letter-spacing: 5px; }
</style>
<defs>
  <filter id="night" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0" /><feComponentTransfer><feFuncR type="linear" slope="-1.003" intercept="1.011" /><feFuncG type="linear" slope="-0.955" intercept="1.0" /><feFuncB type="linear" slope="-0.891" intercept="0.979" /></feComponentTransfer></filter>
  <filter id="mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0" /></filter>
  <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r="1.05" fill="#15171d" /></pattern>
  <pattern id="toneFine" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.7" cy="1.7" r="0.62" fill="#15171d" /></pattern>
  <pattern id="toneBig" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="2.2" fill="#15171d" /></pattern>
  <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#15171d" stroke-width="0.7" /></pattern>
  <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#fff" /></linearGradient>
  <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#fff" /></linearGradient>
  <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#fff" /></linearGradient>
  <mask id="toneDown" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fadeDown)" /></mask>
  <mask id="toneUp" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fadeUp)" /></mask><linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="0" y1="-46" x2="0" y2="-12"><stop offset="0" stop-color="#15171d" stop-opacity="0" /><stop offset="1" stop-color="#15171d" stop-opacity="0.7" /></linearGradient><linearGradient id="tl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#15171d" stop-opacity="0" /><stop offset="1" stop-color="#15171d" stop-opacity="0.55" /></linearGradient><linearGradient id="tr" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#15171d" stop-opacity="0.55" /><stop offset="1" stop-color="#15171d" stop-opacity="0" /></linearGradient></defs>
<rect x="258.0" y="17.6" width="170" height="0.8" fill="url(#tl)" /><rect x="472.0" y="17.6" width="170" height="0.8" fill="url(#tr)" /><text class="tj" x="454.5" y="64" text-anchor="middle">再生中</text><text class="te" x="452.5" y="92" text-anchor="middle">NOW PLAYING</text>
<circle cx="450.0" cy="18" r="11" fill="#e5383b" /><circle cx="450.0" cy="18" r="8.6" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.6" /><text x="450.0" y="22.2" text-anchor="middle" style="font: 800 12px 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif; fill: #ffffff">四</text><circle cx="371.9" cy="88.5" r="1.6" fill="#e5383b" /><circle cx="528.1" cy="88.5" r="1.6" fill="#e5383b" />
</svg>
