
      <svg
        width="300"
        height="165"
        viewBox="0 0 300 165"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #8e3a59;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #4a3b3d;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #4a3b3d;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #ddd; }
    
          

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        
        <defs>
          
          <linearGradient
            id="gradient"
            gradientTransform="rotate(135)"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#fffaf5" />,<stop offset="100%" stop-color="#f9ebe1" />
          </linearGradient>
          
        </defs>
        

        <rect
          data-testid="card-bg"
          class="card-bg"
          x="0.5"
          y="0.5"
          rx="12"
          height="99%"
          stroke="#eadbcd"
          width="299"
          fill="url(#gradient)"
          stroke-opacity="1"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Most Used Languages</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items" x="25">
      
  
      <mask id="rect-mask">
          <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
        </mask>
        
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0"
          y="0"
          width="71.82"
          height="8"
          fill="#b2b7f8"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="71.82"
          y="0"
          width="66.25"
          height="8"
          fill="#f34b7d"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="138.07"
          y="0"
          width="45.47"
          height="8"
          fill="#adb2cb"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="183.54"
          y="0"
          width="31.8"
          height="8"
          fill="#3572A5"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="215.34"
          y="0"
          width="24.32"
          height="8"
          fill="#3178c6"
        />
      
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="239.66"
          y="0"
          width="10.33"
          height="8"
          fill="#f1e05a"
        />
      
      
    <g transform="translate(0, 25)">
      <g transform="translate(0, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#b2b7f8" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Verilog 28.73%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#f34b7d" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        C++ 26.50%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#adb2cb" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        VHDL 18.19%
      </text>
    </g>
  </g></g><g transform="translate(150, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Python 12.72%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        TypeScript 9.73%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JavaScript 4.13%
      </text>
    </g>
  </g></g>
    </g>
  
    </svg>
  
        </g>
      <!-- decorated -->
<defs>
  <linearGradient id="zzGlow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300.0" y2="165.0">
    <stop offset="0" stop-color="#c96f7f" stop-opacity="0.15" />
    <stop offset="0.42" stop-color="#c96f7f" stop-opacity="0.15" />
    <stop offset="0.5" stop-color="#e8a0a8" />
    <stop offset="0.58" stop-color="#8e3a59" stop-opacity="0.15" />
    <stop offset="1" stop-color="#c96f7f" stop-opacity="0.15" />
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 150.0 82.5;360 150.0 82.5" dur="6s" repeatCount="indefinite" />
  </linearGradient>
  <linearGradient id="zzSheen" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55" />
    <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
  </linearGradient>
  <clipPath id="zzClip"><rect x="0.5" y="0.5" width="299.0" height="164.0" rx="12" /></clipPath>
</defs>
<style>
  .zz-sheen { animation: zzSheen 6.5s ease-in-out infinite; }
  @keyframes zzSheen {
    0%, 60% { transform: translateX(-135px) skewX(-20deg); }
    100% { transform: translateX(390px) skewX(-20deg); }
  }
</style>
<g pointer-events="none">
  <g clip-path="url(#zzClip)"><rect class="zz-sheen" x="0" y="-33" width="54" height="231" fill="url(#zzSheen)" /></g>
  <rect x="1" y="1" width="298.0" height="163.0" rx="12" fill="none" stroke="url(#zzGlow)" stroke-width="2" />
</g>
</svg>
    