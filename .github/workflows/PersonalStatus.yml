name: Update README cards

on:
  schedule:
    # 每天 UTC 00:00，即新加坡时间 08:00
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

  # 改了卡片配置后立刻重新生成
  push:
    branches:
      - main
    paths:
      - .github/workflows/PersonalStatus.yml
      - .github/scripts/**

env:
  # 亮色卡片的配色，取自 Background.jpg 的奶油色和玫瑰色
  CARD_COLORS: "title_color=8e3a59&text_color=4a3b3d&icon_color=c96f7f&bg_color=135,fffaf5,f9ebe1&border_color=eadbcd&border_radius=12"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # GitHub Statistics
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide=prs&ring_color=8e3a59&${{ env.CARD_COLORS }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top Languages
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&${{ env.CARD_COLORS }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Typewriter-Nocturne
      - name: Generate Typewriter-Nocturne card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Typewriter-Nocturne&${{ env.CARD_COLORS }}"
          path: profile/pin-typewriter-nocturne.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Yohaku
      - name: Generate Yohaku card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Yohaku&${{ env.CARD_COLORS }}"
          path: profile/pin-yohaku.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub 奖杯：公共的 vercel 服务失效了，这里直接运行它的代码生成 SVG
      - name: Check out the trophy generator
        uses: actions/checkout@v6
        with:
          repository: ryo-ma/github-profile-trophy
          ref: 43736b50a82fca73c8df1c81abb40aa03519975c
          path: .trophy

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # 和上游 CI 用的版本一致
          deno-version: "1.44.4"

      - name: Generate trophies
        # 接口偶尔出错时保留上一次的奖杯，不影响其他卡片
        continue-on-error: true
        working-directory: .trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ../.github/scripts/render-trophy.ts .
          deno run --allow-net --allow-env --allow-read --allow-write render-trophy.ts "${{ github.repository_owner }}" ../profile/trophy.svg

      # 活动折线图：先下载到仓库里，再由 decorate.py 加动画；接口出错时保留上一次的图
      - name: Download activity graph
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o profile/activity.svg.tmp "https://github-readme-activity-graph-inky.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=fdf6ef&color=4a3b3d&line=c96f7f&point=8e3a59&area=true&area_color=e8b4b8&title_color=8e3a59&hide_border=true&radius=12&custom_title=Activity%20Graph"
          mv profile/activity.svg.tmp profile/activity.svg

      # 贪吃蛇：亮色格子，玫瑰色从浅到深，蛇是墨色
      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-raw.svg?color_snake=#4a3b3d&color_dots=#efe2d8,#f2c9c4,#e39aa6,#c96f7f,#8e3a59

      # 给卡片加流光边框和扫光，活动图加折线动画，贪吃蛇包进卡片
      - name: Decorate cards
        run: python3 .github/scripts/decorate.py

      # Commit all generated SVG files
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
