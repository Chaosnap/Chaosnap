<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="40" viewBox="0 0 800 40" role="presentation">
<style>
  .float { transform-box: fill-box; transform-origin: center bottom; animation: float 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 35% { transform: translateY(-5px) rotate(-1.4deg); } 70% { transform: translateY(-1.5px) rotate(1deg); } }
  .cmy-c { animation: misC 5.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  .cmy-m { animation: misM 5.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes misC { 0%, 100% { transform: translate(-1.6px, 0.4px); } 50% { transform: translate(-2.6px, 1px); } 88% { transform: translate(-1.6px, 0.4px); } 90% { transform: translate(-6px, 1px); } 92% { transform: translate(-1.6px, 0.4px); } }
  @keyframes misM { 0%, 100% { transform: translate(1.6px, -0.4px); } 50% { transform: translate(2.4px, -1px); } 88% { transform: translate(1.6px, -0.4px); } 90% { transform: translate(6px, -1px); } 92% { transform: translate(1.6px, -0.4px); } }
  .jf { animation: jfDrift 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes jfDrift { 0%, 100% { transform: translate(0, 0) rotate(-3deg); } 45% { transform: translate(4px, -14px) rotate(3deg); } }
  .jf-bell { animation: jfPulse 3.4s infinite; }
  @keyframes jfPulse {
    0% { transform: scale(1, 1); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    26% { transform: scale(1.09, 0.86); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    100% { transform: scale(1, 1); }
  }
  .jf-thrust { animation: jfThrust 3.4s infinite; }
  @keyframes jfThrust {
    0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    30% { transform: translateY(-9px); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    100% { transform: translateY(0); }
  }
  .chime { animation: chimeSwing 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  .chime-paper { animation: paperSwing 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; animation-delay: -0.5s; }
  @keyframes chimeSwing { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }
  @keyframes paperSwing { 0%, 100% { transform: rotate(13deg); } 50% { transform: rotate(-13deg); } }
  .bub-rise { animation: bubRise linear infinite; }
  .bub-wob { animation: bubWob 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate; }
  @keyframes bubRise { 0% { opacity: 0; transform: translateY(0); } 12% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(var(--rise, -120px)); } }
  @keyframes bubWob { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
  .petal-fall { animation: petalFall linear infinite; }
  .petal-flip { animation: petalFlip 1.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate; }
  @keyframes petalFall { 0% { opacity: 0; transform: translate(0, -20px) rotate(0deg); } 10% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 80px), var(--fall, 300px)) rotate(var(--spin, 300deg)); } }
  @keyframes petalFlip { from { transform: scaleX(1) rotate(-10deg); } to { transform: scaleX(-0.35) rotate(18deg); } }
  .umbrella { animation: umbrella 5.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes umbrella { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-4px); } }
  .focus-a { animation: focusA 0.36s steps(1) infinite; }
  .focus-b { animation: focusB 0.36s steps(1) infinite; }
  @keyframes focusA { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes focusB { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.2s 0.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pop { transform-box: fill-box; transform-origin: center bottom; animation: pop 4.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes pop { 0%, 100% { transform: scale(1) rotate(0deg); } 8% { transform: scale(1.08) rotate(-3deg); } 16% { transform: scale(0.98) rotate(1deg); } 24% { transform: scale(1) rotate(0deg); } }
  .rain { animation: rain 0.55s linear infinite; }
  @keyframes rain { from { transform: translate(0, 0); } to { transform: translate(-14px, 56px); } }
  .drop { animation: drop 2.6s cubic-bezier(0.55, 0, 1, 0.45) infinite; }
  @keyframes drop { 0%, 55% { opacity: 0; transform: translateY(0) scale(0.4); } 62% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(70px) scale(1); } }
  .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
  @keyframes ripple { 0% { opacity: 0.9; transform: scale(0.1); } 100% { opacity: 0; transform: scale(1); } }
  .cy { fill: #2fb6d6 !important; }
  .mg { fill: #e53878 !important; }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
</style>
<defs>
  <filter id="night" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0" /><feComponentTransfer><feFuncR type="linear" slope="-1.003" intercept="1.011" /><feFuncG type="linear" slope="-0.955" intercept="1.0" /><feFuncB type="linear" slope="-0.891" intercept="0.979" /></feComponentTransfer></filter>
  <filter id="mono" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0" /></filter>
  <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r="1.05" fill="#15171d" /></pattern>
  <pattern id="toneFine" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.7" cy="1.7" r="0.62" fill="#15171d" /></pattern>
  <pattern id="toneBig" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="2.2" fill="#15171d" /></pattern>
  <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#15171d" stroke-width="0.7" /></pattern>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0.09 0" /></filter>
  <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#fff" /></linearGradient>
  <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#fff" /></linearGradient>
  <mask id="toneDown"><rect x="-10%" y="-10%" width="120%" height="120%" fill="url(#fadeDown)" /></mask><linearGradient id="ruleL" x1="0" x2="1"><stop offset="0" stop-color="#15171d" stop-opacity="0" /><stop offset="1" stop-color="#15171d" /></linearGradient><linearGradient id="ruleR" x1="0" x2="1"><stop offset="0" stop-color="#15171d" /><stop offset="1" stop-color="#15171d" stop-opacity="0" /></linearGradient></defs>
<g filter="url(#night)"><rect x="30" y="19.5" width="340" height="1" fill="url(#ruleL)" /><rect x="430" y="19.5" width="340" height="1" fill="url(#ruleR)" /><rect x="30" y="23" width="340" height="0.5" fill="url(#ruleL)" opacity="0.6" /><rect x="430" y="23" width="340" height="0.5" fill="url(#ruleR)" opacity="0.6" /><g transform="translate(400 20)"><g class="twinkle" style="animation-duration:5s"><path d="M0 -7C1 -10 3 -12 5 -12C9 -12 11 -6 9 0C7 6 3 10 0 13C-3 10 -7 6 -9 0C-11 -6 -9 -12 -5 -12C-3 -12 -1 -10 0 -7Z" transform="scale(0.8)" fill="#f3f1ee" stroke="#15171d" stroke-width="1.1" /></g></g><g transform="translate(436 40)"><g class="bub-rise" style="--rise:-26px;animation-duration:5.3s;animation-delay:-7.5s"><g class="bub-wob" style="animation-delay:-5.3s"><circle r="1.9" fill="#f3f1ee" fill-opacity="0.3" stroke="#15171d" stroke-width="0.70" /><path d="M-1.2 -0.2A1.3 1.3 0 0 1 -0.2 -1.2" fill="none" stroke="#15171d" stroke-width="0.60" stroke-linecap="round" /><path d="M0.7 1.0A1.3 1.3 0 0 0 1.2 0.4" fill="none" stroke="#15171d" stroke-width="0.40" stroke-linecap="round" opacity="0.6" /></g></g></g><g transform="translate(414 36)"><g class="bub-rise" style="--rise:-17px;animation-duration:7.4s;animation-delay:-5.2s"><g class="bub-wob" style="animation-delay:-3.7s"><circle r="2.8" fill="#f3f1ee" fill-opacity="0.3" stroke="#15171d" stroke-width="0.70" /><path d="M-1.8 -0.3A1.9 1.9 0 0 1 -0.2 -1.8" fill="none" stroke="#15171d" stroke-width="0.60" stroke-linecap="round" /><path d="M1.0 1.6A2.0 2.0 0 0 0 1.8 0.6" fill="none" stroke="#15171d" stroke-width="0.40" stroke-linecap="round" opacity="0.6" /></g></g></g><g transform="translate(394 36)"><g class="bub-rise" style="--rise:-23px;animation-duration:9.0s;animation-delay:-8.5s"><g class="bub-wob" style="animation-delay:-6.0s"><circle r="3.0" fill="#f3f1ee" fill-opacity="0.3" stroke="#15171d" stroke-width="0.70" /><path d="M-1.9 -0.3A2.0 2.0 0 0 1 -0.2 -1.9" fill="none" stroke="#15171d" stroke-width="0.60" stroke-linecap="round" /><path d="M1.1 1.7A2.1 2.1 0 0 0 1.9 0.6" fill="none" stroke="#15171d" stroke-width="0.40" stroke-linecap="round" opacity="0.6" /></g></g></g><g transform="translate(396 36)"><g class="bub-rise" style="--rise:-19px;animation-duration:5.1s;animation-delay:-4.2s"><g class="bub-wob" style="animation-delay:-2.9s"><circle r="1.9" fill="#f3f1ee" fill-opacity="0.3" stroke="#15171d" stroke-width="0.70" /><path d="M-1.2 -0.2A1.2 1.2 0 0 1 -0.1 -1.2" fill="none" stroke="#15171d" stroke-width="0.60" stroke-linecap="round" /><path d="M0.7 1.0A1.3 1.3 0 0 0 1.2 0.4" fill="none" stroke="#15171d" stroke-width="0.40" stroke-linecap="round" opacity="0.6" /></g></g></g><g transform="translate(390 39)"><g class="bub-rise" style="--rise:-14px;animation-duration:7.2s;animation-delay:-2.1s"><g class="bub-wob" style="animation-delay:-1.5s"><circle r="2.7" fill="#f3f1ee" fill-opacity="0.3" stroke="#15171d" stroke-width="0.70" /><path d="M-1.7 -0.3A1.8 1.8 0 0 1 -0.2 -1.7" fill="none" stroke="#15171d" stroke-width="0.60" stroke-linecap="round" /><path d="M0.9 1.5A1.9 1.9 0 0 0 1.7 0.5" fill="none" stroke="#15171d" stroke-width="0.40" stroke-linecap="round" opacity="0.6" /></g></g></g></g>
<circle cx="400" cy="20" r="1.6" fill="#e5383b" />
</svg>
