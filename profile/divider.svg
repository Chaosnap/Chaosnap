<svg xmlns="http://www.w3.org/2000/svg" width="800" height="44" viewBox="0 0 800 44" role="presentation">
  <style>
  .float { transform-box: fill-box; transform-origin: center bottom; animation: float 3.8s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-7px) rotate(-2deg); } 65% { transform: translateY(-2px) rotate(1.5deg); } }
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.5) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(45deg); } }
  .bokeh { animation: drift linear infinite; }
  @keyframes drift { 0% { opacity: 0; transform: translate(0, 20px); } 20% { opacity: 0.9; } 80% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--dx, 10px), var(--dy, -90px)); } }
  .bubble { animation: bubble ease-in infinite; }
  @keyframes bubble { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 15% { opacity: 0.95; } 85% { opacity: 0.8; } 100% { opacity: 0; transform: translate(var(--dx, 6px), var(--dy, -80px)) scale(1.1); } }
  .sun-icon { animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chime { animation: swing 3.4s ease-in-out infinite; }
  .chime-paper { animation: swing 2.2s ease-in-out infinite reverse; }
  @keyframes swing { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-7deg); } }
  .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.8s 0.3s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .wave { animation: slide linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(var(--len, -120px)); } }
</style>
