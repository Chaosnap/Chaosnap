<svg xmlns="http://www.w3.org/2000/svg" width="260" height="420" viewBox="0 0 260 420" role="presentation">
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: beat 1.2s ease-in-out infinite alternate; }
    .note { fill: #d9798a; opacity: 0; animation: float 7s ease-in-out infinite; }
    .spark { fill: #e8a0a8; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
    @keyframes beat { from { transform: scaleX(0.28); } to { transform: scaleX(1); } }
    @keyframes float {
      0% { opacity: 0; transform: translateY(26px) rotate(-10deg); }
      25% { opacity: 0.95; }
      75% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-46px) rotate(10deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.65) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
    }
  </style>
