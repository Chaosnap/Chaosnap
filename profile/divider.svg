<svg xmlns="http://www.w3.org/2000/svg" width="800" height="32" viewBox="0 0 800 32" role="presentation">
  <style>
    .star { transform-origin: 400px 16px; animation: twinkle 2.8s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
    .spark.late { animation-delay: 1.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.45; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.1) rotate(45deg); }
    }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C96F7F" stop-opacity="0" />
      <stop offset="0.5" stop-color="#C96F7F" />
      <stop offset="1" stop-color="#C96F7F" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="40" y="15.5" width="330" height="1" fill="url(#fade)" />
  <rect x="430" y="15.5" width="330" height="1" fill="url(#fade)" />
  <path class="star" fill="#C96F7F" d="M400 5c1 7 4 10 11 11-7 1-10 4-11 11-1-7-4-10-11-11 7-1 10-4 11-11z" />
  <path class="spark" fill="#E8B4B8" d="M372 11.5c.4 2.900 1.600 4.100 4.500 4.500-2.900.4-4.100 1.600-4.500 4.500-.4-2.900-1.600-4.100-4.500-4.500 2.900-.4 4.100-1.600 4.500-4.500z" />
  <path class="spark late" fill="#E8B4B8" d="M428 11.500c.4 2.900 1.600 4.100 4.500 4.500-2.900.4-4.100 1.600-4.500 4.500-.4-2.900-1.600-4.100-4.500-4.500 2.900-.4 4.100-1.600 4.500-4.500z" />
</svg>
